name: Trading Engine

on:
  schedule:
    # Every 5 min during market hours (13:30–20:05 UTC = 9:30AM–4:05PM ET)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: 'entry or exit'
        default: 'entry'
      trader_type:
        description: 'micro or macro (leave blank for both)'
        default: ''

jobs:
  micro-entry:
    name: Micro — entry scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger
        run: |
          echo "Calling micro entry at $(date -u)"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "${{ secrets.APP_URL }}/api/engine/run?phase=entry&trader_type=micro" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq '.' || echo "$BODY"
          [ "$HTTP_CODE" -lt 400 ] || exit 1

  micro-exit:
    name: Micro — exit scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger
        run: |
          echo "Calling micro exit at $(date -u)"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "${{ secrets.APP_URL }}/api/engine/run?phase=exit&trader_type=micro" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq '.' || echo "$BODY"
          [ "$HTTP_CODE" -lt 400 ] || exit 1

  macro-entry:
    name: Macro — entry scan (every 30 min)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger
        run: |
          MINUTE=$(date -u +%M)
          # Fire at :00–:04 and :30–:34 past each hour
          if [ "$MINUTE" -lt "5" ] || ([ "$MINUTE" -ge "30" ] && [ "$MINUTE" -lt "35" ]); then
            echo "Macro entry scan at $(date -u)"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
              "${{ secrets.APP_URL }}/api/engine/run?phase=entry&trader_type=macro" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "HTTP $HTTP_CODE"
            echo "$BODY" | jq '.' || echo "$BODY"
            [ "$HTTP_CODE" -lt 400 ] || exit 1
          else
            echo "Not a 30-min window (:${MINUTE}), skipping"
          fi

  macro-exit:
    name: Macro — exit scan (every 30 min)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger
        run: |
          MINUTE=$(date -u +%M)
          # Fire at :00–:04 and :30–:34 past each hour
          if [ "$MINUTE" -lt "5" ] || ([ "$MINUTE" -ge "30" ] && [ "$MINUTE" -lt "35" ]); then
            echo "Macro exit window — calling at $(date -u)"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
              "${{ secrets.APP_URL }}/api/engine/run?phase=exit&trader_type=macro" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "HTTP $HTTP_CODE"
            echo "$BODY" | jq '.' || echo "$BODY"
            [ "$HTTP_CODE" -lt 400 ] || exit 1
          else
            echo "Outside macro exit window (now :${MINUTE}), skipping"
          fi

  manual:
    name: Manual trigger
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger
        run: |
          TRADER="${{ inputs.trader_type }}"
          PHASE="${{ inputs.phase }}"
          URL="${{ secrets.APP_URL }}/api/engine/run?phase=${PHASE}"
          if [ -n "$TRADER" ]; then
            URL="${URL}&trader_type=${TRADER}"
          fi
          echo "Calling $URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq '.' || echo "$BODY"
          [ "$HTTP_CODE" -lt 400 ] || exit 1
